# @package _global_
# LeakRU accuracy-only eval on θ_u (FQ_SH matching). No Probab / FocusOnKey.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /eval: leakru_tofu05_acc

model:
  model_args:
    pretrained_model_name_or_path: ???
    attn_implementation: eager
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

seed: 1001

eval:
  leakru:
    pretrained_logs_path: workspace/saves/eval/leakru_tofu05_theta_p/LeakRU_EVAL.json
    data_path: /usr/local/ASU-unlearning/workspace/data/leakru/tofu_forget05.jsonl
    subset: tofu_forget05
    per_type_limit: null
    overwrite: true
    batch_size: 4

task_name: leakru_tofu05_theta_u_acc
paths:
  output_dir: workspace/saves/eval/${task_name}
