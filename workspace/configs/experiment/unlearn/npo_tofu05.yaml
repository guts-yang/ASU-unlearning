# @package _global_
# NPO + GD retain  TOFU forget05 / retain95  seed 1001

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: NPO
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full
    attn_implementation: eager
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

forget_split: forget05
retain_split: retain95
holdout_split: holdout05
retain_logs_path: /root/autodl-tmp/saves/eval/tofu_Llama-2-7b-chat-hf_retain95/TOFU_EVAL.json
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    beta: 0.1
    alpha: 1.0
    gamma: 1.0
    retain_loss_type: NLL
  args:
    learning_rate: 1.0e-5
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    num_train_epochs: 5
    warmup_epochs: 1.0
    eval_strategy: "no"
    do_eval: false
    seed: 1001
    bf16: true
    bf16_full_eval: true
    gradient_checkpointing: true
    optim: paged_adamw_32bit
    weight_decay: 0.01
    save_strategy: epoch
    save_only_model: true

task_name: npo_tofu05_seed1001
paths:
  output_dir: workspace/saves/unlearn/${task_name}
