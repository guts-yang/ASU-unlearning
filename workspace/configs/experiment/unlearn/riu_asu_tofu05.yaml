# @package _global_
# RIU plug-in on ASU base  TOFU forget05 / retain95  Llama-2-7B-Chat  seed 1001
# pilot: 1 epoch; use num_train_epochs=5 for the full comparison.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: RIU
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full
    attn_implementation: eager
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

forget_split: forget05
retain_split: retain95
holdout_split: holdout05
retain_logs_path: /root/autodl-tmp/saves/eval/tofu_Llama-2-7b-chat-hf_retain95/TOFU_EVAL.json
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

collator:
  DataCollatorForSupervisedDataset:
    args:
      index: index

trainer:
  method_args:
    base: ASU
    attention_temp: 2.3
    layers_id: null
    alpha: 0.1
    gamma: 1.0
    retain_loss_type: NLL
    probe_layer: 7
    probe_target: both
    num_classes: 10
    fact_id_stride: 20
    probe_weight: 0.1
    grl_lambda: 0.1
    cons_weight: 0.1
    geom_weight: 0.1
    geom_mode: corrected
  args:
    learning_rate: 1.0e-5
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    num_train_epochs: 1
    warmup_ratio: 0.1
    eval_strategy: "no"
    eval_on_start: false
    do_eval: false
    seed: 1001
    bf16: true
    bf16_full_eval: true
    gradient_checkpointing: true
    optim: adamw_bnb_8bit
    weight_decay: 0.01
    save_strategy: epoch
    save_total_limit: 2
    save_only_model: true
    logging_steps: 5
    report_to: none

task_name: riu_asu_tofu05_pilot_seed1001
paths:
  output_dir: /jizhicfs/chenyliao/runs/asu-apru/unlearn/${task_name}
