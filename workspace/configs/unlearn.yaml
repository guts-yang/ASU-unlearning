# Primary Hydra config for QKSpec. Base groups (model/data/eval/...) are
# resolved from open-unlearning/configs via hydra.searchpath supplied by the
# launcher; QKSpec-specific groups live under this directory.
defaults:
  - model: Llama-3.2-1B-Instruct
  - trainer: QKSpec
  - data: unlearn
  - collator: DataCollatorForSupervisedDataset
  - eval: tofu
  - hydra: default
  - paths: default
  - experiment: null
  - _self_

trainer:
  args:
    remove_unused_columns: False

mode: unlearn
task_name: ???
