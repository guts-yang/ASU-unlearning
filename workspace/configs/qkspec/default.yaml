# QKSpec core defaults. Referenced by trainer/QKSpec.yaml via Hydra.
# Sizing is deliberately conservative; raise top_k / ranks for fuller runs.

# Layer range (null = all layers)
layer_start: null
layer_end: null

# Stage A pre-screen + Top-K
shortlist_per_layer: 4
max_candidate_heads: 128
top_k_directions: 16
ranks_per_head: 4
edge_top_fraction: 1.0

# Contraction
rho: 0.5
min_singular_value: 1.0e-6

# Discovery / eval batching
max_length: 512
discovery_batch_size: 4
max_discovery_batches: null
stage_b_batch_size: 4
max_stage_b_batches: null

# Stage B causal re-check + retain constraint
stage_b_min_nll_increase: 0.0
specificity_weight: 1.0
max_retain_impact: null

# Controls
run_controls: true
noop_rho: 1.0
control_seed: 42
control_modes:
  - noop
  - random_isospectral
  - shuffle

# Engineering checks
enable_rope_check: true
rope_check_positions: [0, 64, 128, 256]

# Data / failure policy
fallback_retain_random: true
empty_direction_action: noop
